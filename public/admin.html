<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - Disponibilidad de Notebooks</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="layout admin-layout">
    <aside class="panel">
      <div>
        <div class="marca">
          <div class="logo">⚙️</div>
          <span>Administración</span>
        </div>
        <h2>Panel Admin</h2>
        <p>Gestión de reportes, préstamos, notebooks y usuarios de la escuela.</p>
      </div>
      <nav class="menu-admin">
        <button class="boton enlace-menu activo" data-seccion="reportes">Reportes pendientes</button>
        <button class="boton enlace-menu" data-seccion="prestamos">Préstamos activos</button>
        <button class="boton enlace-menu" data-seccion="notebooks">Gestionar notebooks</button>
        <button class="boton enlace-menu" data-seccion="usuarios">Gestionar usuarios</button>
      </nav>
      <div>
        <a href="dashboard.html" class="boton" style="display:block; text-align:center; text-decoration:none; margin-bottom:12px;">Volver al panel</a>
        <button id="salir" class="boton" style="background:var(--error);">Cerrar sesión</button>
      </div>
    </aside>

    <main class="contenido-admin">
      <header class="header-admin">
        <h1 id="titulo-seccion">Reportes pendientes</h1>
        <span id="usuario-admin">Admin</span>
      </header>

      <div id="mensaje" class="mensaje"></div>

      <!-- Secciones dinámicas -->
      <section id="sec-reportes" class="seccion-admin">
        <div id="lista-reportes" class="lista-admin"></div>
      </section>

      <section id="sec-prestamos" class="seccion-admin" hidden>
        <table class="tabla-admin">
          <thead>
            <tr><th>Notebook</th><th>Usuario</th><th>Rol</th><th>Retiro</th></tr>
          </thead>
          <tbody id="tabla-prestamos-body"></tbody>
        </table>
      </section>

      <section id="sec-notebooks" class="seccion-admin" hidden>
        <form id="form-nueva-nb" class="tarjeta-form" style="margin-bottom:20px; max-width:100%;">
          <h3>Agregar Notebook</h3>
          <div class="dos" style="display:flex; gap:10px; margin-top:10px;">
            <input type="text" id="nb-numero" placeholder="Número (ej: 21)" required>
            <select id="nb-color">
              <option value="blanca">Blanca</option>
              <option value="negra">Negra</option>
            </select>
            <button type="submit" class="boton" style="width:auto; margin-top:0;">Crear</button>
          </div>
        </form>
        <div id="lista-notebooks-admin" class="lista-admin"></div>
      </section>

      <section id="sec-usuarios" class="seccion-admin" hidden>
        <table class="tabla-admin">
          <thead>
            <tr><th>Nombre</th><th>DNI</th><th>Rol</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tabla-usuarios-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/Usuario.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
